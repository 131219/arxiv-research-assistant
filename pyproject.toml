[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-bedrock-kb-pipeline"
version = "0.1.0"
description = "AWS-native arXiv ingestion pipeline for Amazon Bedrock Knowledge Bases"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "botocore>=1.34,<2",
  "pydantic>=2.7,<3",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff==0.15.22",
  "cfn-lint>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
