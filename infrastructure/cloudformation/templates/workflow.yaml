AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Workflow infrastructure for the arXiv ingestion pipeline, including
  manifest-parser and run-summary Lambda functions, the Step Functions
  execution role, and distributed ingestion state machine.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  ProjectName:
    Type: String
    Default: arxiv

  RunSummaryCodeS3Key:
    Type: String
    Default: artifacts/lambda/run-summary-writer.zip
    Description: S3 key containing the run-summary Lambda ZIP package.

  ManifestParserCodeS3Key:
    Type: String
    Default: artifacts/lambda/manifest-parser.zip
    Description: S3 key containing the manifest-parser Lambda ZIP package.

  ValidateOutputsCodeS3Key:
    Type: String
    Default: artifacts/lambda/validate-outputs.zip
    Description: S3 key containing the output-validation Lambda ZIP package.

  KnowledgeBaseId:
    Type: String
    Description: Amazon Bedrock Knowledge Base ID.

  DataSourceId:
    Type: String
    Description: Amazon Bedrock Knowledge Base data source ID.

Resources:
  ManifestParserLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-manifest-parser-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ManifestParserS3Policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOfficialArxivManifest
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: arn:aws:s3:::arxiv/pdf/arXiv_pdf_manifest.xml

              - Sid: WriteGeneratedWorkLists
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${CorpusBucket}/control/worklists/*"
                    - CorpusBucket:
                        Fn::ImportValue:
                          Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"

              - Sid: ReadArchiveSuccessMarkers
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${CorpusBucket}/status/arxiv/*"
                    - CorpusBucket:
                        Fn::ImportValue:
                          Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"

              - Sid: ListArchiveSuccessMarkers
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${CorpusBucket}"
                    - CorpusBucket:
                        Fn::ImportValue:
                          Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"
                Condition:
                  StringLike:
                    s3:prefix:
                      - "status/arxiv/*"

      Tags:
        - Key: Project
          Value: arxiv-pipeline
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  ManifestParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-manifest-parser-${Environment}"
      Description: Generates a monthly arXiv JSONL work list in S3.
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: lambda_function.lambda_handler
      Role: !GetAtt ManifestParserLambdaRole.Arn
      Timeout: 180
      MemorySize: 512

      Environment:
        Variables:
          MANIFEST_BUCKET:
            Fn::ImportValue:
              Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"

      Code:
        S3Bucket:
          Fn::ImportValue:
            Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"
        S3Key: !Ref ManifestParserCodeS3Key

      Tags:
        - Key: Project
          Value: arxiv-pipeline
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  ValidateOutputsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-validate-outputs-lambda-role-${Environment}"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ValidateOutputsS3Policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadGeneratedWorkLists
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${CorpusBucket}/control/worklists/*"
                    - CorpusBucket:
                        Fn::ImportValue:
                          Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"

              - Sid: ReadArchiveSuccessMarkers
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${CorpusBucket}/status/arxiv/*"
                    - CorpusBucket:
                        Fn::ImportValue:
                          Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"

              - Sid: WriteValidationReports
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${CorpusBucket}/reports/*"
                    - CorpusBucket:
                        Fn::ImportValue:
                          Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"

      Tags:
        - Key: Project
          Value: arxiv-pipeline
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  ValidateOutputsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-validate-outputs-${Environment}"
      Description: Validates archive completion markers before Bedrock ingestion.
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: lambda_function.lambda_handler
      Role: !GetAtt ValidateOutputsLambdaRole.Arn
      Timeout: 300
      MemorySize: 512

      Environment:
        Variables:
          OUTPUT_BUCKET:
            Fn::ImportValue:
              Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"

      Code:
        S3Bucket:
          Fn::ImportValue:
            Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"
        S3Key: !Ref ValidateOutputsCodeS3Key

      Tags:
        - Key: Project
          Value: arxiv-pipeline
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  RunSummaryLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-run-summary-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: RunSummaryS3WritePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteRunSummaries
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${CorpusBucket}/runs/*"
                    - CorpusBucket:
                        Fn::ImportValue:
                          Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"

      Tags:
        - Key: Project
          Value: arxiv-pipeline
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  RunSummaryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-run-summary-writer-${Environment}"
      Description: Writes the final Step Functions ingestion summary to S3.
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt RunSummaryLambdaRole.Arn
      Timeout: 30
      MemorySize: 128

      Code:
        S3Bucket:
          Fn::ImportValue:
            Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"
        S3Key: !Ref RunSummaryCodeS3Key

      Tags:
        - Key: Project
          Value: arxiv-pipeline
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-step-functions-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - states.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: DistributedMapPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadDistributedMapManifest
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - Fn::Sub:
                      - "arn:${AWS::Partition}:s3:::${CorpusBucket}/control/worklists/*"
                      - CorpusBucket:
                          Fn::ImportValue:
                            Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"
                  - Fn::Sub:
                      - "arn:${AWS::Partition}:s3:::${CorpusBucket}/orchestration/manifests/*"
                      - CorpusBucket:
                          Fn::ImportValue:
                            Fn::Sub: "${ProjectName}-${Environment}-corpus-bucket-name"

              - Sid: StartDistributedMapExecutions
                Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${StateMachineName}"
                    - StateMachineName: !Sub "${ProjectName}-ingestion-pipeline-${Environment}"

              - Sid: DescribeDistributedMapExecutions
                Effect: Allow
                Action:
                  - states:DescribeExecution
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${StateMachineName}:*"
                    - StateMachineName: !Sub "${ProjectName}-ingestion-pipeline-${Environment}"

        - PolicyName: BatchIntegrationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SubmitBatchJobs
                Effect: Allow
                Action:
                  - batch:SubmitJob
                Resource:
                  - Fn::ImportValue:
                      Fn::Sub: "${ProjectName}-${Environment}-batch-job-queue-arn"
                  - !Sub "arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/${ProjectName}-pipeline-job-${Environment}"
                  - !Sub "arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/${ProjectName}-pipeline-job-${Environment}:*"

              - Sid: DescribeBatchJobs
                Effect: Allow
                Action:
                  - batch:DescribeJobs
                Resource: "*"

              - Sid: TerminatePipelineBatchJobs
                Effect: Allow
                Action:
                  - batch:TerminateJob
                Resource:
                  - !Sub "arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job/*"

              - Sid: ManageBatchCompletionEventRule
                Effect: Allow
                Action:
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForBatchJobsRule"

        - PolicyName: BedrockIngestionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageKnowledgeBaseIngestion
                Effect: Allow
                Action:
                  - bedrock:StartIngestionJob
                  - bedrock:GetIngestionJob
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"

        - PolicyName: InvokeWorkflowLambdasPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeWorkflowLambdas
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ManifestParserFunction.Arn
                  - !GetAtt ValidateOutputsFunction.Arn
                  - !GetAtt RunSummaryFunction.Arn

        - PolicyName: StepFunctionsLoggingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageStepFunctionsLogDelivery
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

      Tags:
        - Key: Project
          Value: arxiv-pipeline
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  IngestionStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${ProjectName}-ingestion-pipeline-${Environment}"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn

      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn:
                Fn::Join:
                  - ""
                  - - Fn::Sub: "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:"
                    - Fn::ImportValue:
                        Fn::Sub: "${ProjectName}-${Environment}-log-group-name"
                    - ":*"

      TracingConfiguration:
        Enabled: false

      DefinitionSubstitutions:
        BatchJobQueueArn:
          Fn::ImportValue:
            Fn::Sub: "${ProjectName}-${Environment}-batch-job-queue-arn"

        BatchJobDefinitionName: !Sub "${ProjectName}-pipeline-job-${Environment}"

        ManifestParserFunctionArn: !GetAtt ManifestParserFunction.Arn
        ValidateOutputsFunctionArn: !GetAtt ValidateOutputsFunction.Arn
        RunSummaryFunctionArn: !GetAtt RunSummaryFunction.Arn
        KnowledgeBaseId: !Ref KnowledgeBaseId
        DataSourceId: !Ref DataSourceId

      DefinitionString: |
        {
          "Comment": "Process arXiv TAR archives in parallel using AWS Batch.",
          "StartAt": "GenerateManifest",
          "States": {
            "GenerateManifest": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ManifestParserFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": {
                "run_id.$": "$.Payload.run_id",
                "year.$": "$.Payload.year",
                "month.$": "$.Payload.month",
                "manifest_bucket.$": "$.Payload.manifest_bucket",
                "manifest_key.$": "$.Payload.manifest_key",
                "archive_count.$": "$.Payload.archive_count",
                "expected_pdf_count.$": "$.Payload.expected_pdf_count",
                "total_archive_bytes.$": "$.Payload.total_archive_bytes"
              },
              "ResultPath": "$.manifest_generation",
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "Lambda.TooManyRequestsException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Next": "ProcessArchives"
            },
            "ProcessArchives": {
              "Type": "Map",
              "Label": "ArxivArchives",
              "ItemReader": {
                "Resource": "arn:aws:states:::s3:getObject",
                "ReaderConfig": {
                  "InputType": "JSONL"
                },
                "Parameters": {
                  "Bucket.$": "$.manifest_generation.manifest_bucket",
                  "Key.$": "$.manifest_generation.manifest_key"
                }
              },
              "ItemSelector": {
                "source_bucket.$": "$$.Map.Item.Value.source_bucket",
                "source_key.$": "$$.Map.Item.Value.source_key",
                "request_payer.$": "$$.Map.Item.Value.request_payer",
                "run_id.$": "$$.Map.Item.Value.run_id",
                "target_year.$": "$$.Map.Item.Value.target_year",
                "target_month.$": "$$.Map.Item.Value.target_month",
                "sequence_number.$": "$$.Map.Item.Value.sequence_number",
                "number_of_items.$": "$$.Map.Item.Value.number_of_items",
                "tar_md5.$": "$$.Map.Item.Value.tar_md5",
                "output_bucket.$": "$.output_bucket",
                "skip_completed.$": "$.skip_completed"
              },
              "ItemProcessor": {
                "ProcessorConfig": {
                  "Mode": "DISTRIBUTED",
                  "ExecutionType": "STANDARD"
                },
                "StartAt": "SubmitBatchJob",
                "States": {
                  "SubmitBatchJob": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::batch:submitJob.sync",
                    "Parameters": {
                      "JobName.$": "States.Format('arxiv-archive-{}', $.sequence_number)",
                      "JobQueue": "${BatchJobQueueArn}",
                      "JobDefinition": "${BatchJobDefinitionName}",
                      "Parameters": {
                        "source_bucket.$": "$.source_bucket",
                        "source_key.$": "$.source_key",
                        "request_payer.$": "$.request_payer",
                        "run_id.$": "$.run_id",
                        "target_year.$": "States.Format('{}', $.target_year)",
                        "target_month.$": "States.Format('{}', $.target_month)",
                        "expected_item_count.$": "States.Format('{}', $.number_of_items)",
                        "tar_md5.$": "$.tar_md5",
                        "output_bucket.$": "$.output_bucket",
                        "skip_completed.$": "States.Format('{}', $.skip_completed)"
                      }
                    },
                    "Retry": [
                      {
                        "ErrorEquals": [
                          "Batch.AWSBatchException",
                          "States.TaskFailed"
                        ],
                        "IntervalSeconds": 20,
                        "MaxAttempts": 3,
                        "BackoffRate": 2.0
                      }
                    ],
                    "End": true
                  }
                }
              },
              "MaxConcurrencyPath": "$.max_concurrency",
              "ToleratedFailureCount": 0,
              "ResultPath": null,
              "Next": "ValidateOutputs"
            },
            "ValidateOutputs": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ValidateOutputsFunctionArn}",
                "Payload": {
                  "run_id.$": "$.run_id",
                  "manifest_bucket.$": "$.manifest_generation.manifest_bucket",
                  "manifest_key.$": "$.manifest_generation.manifest_key",
                  "output_bucket.$": "$.output_bucket"
                }
              },
              "ResultSelector": {
                "run_id.$": "$.Payload.run_id",
                "validation_passed.$": "$.Payload.validation_passed",
                "expected_archive_count.$": "$.Payload.expected_archive_count",
                "valid_archive_count.$": "$.Payload.valid_archive_count",
                "invalid_archive_count.$": "$.Payload.invalid_archive_count",
                "expected_pdf_count.$": "$.Payload.expected_pdf_count",
                "successful_pdf_count.$": "$.Payload.successful_pdf_count",
                "failed_pdf_count.$": "$.Payload.failed_pdf_count",
                "report_bucket.$": "$.Payload.report_bucket",
                "report_key.$": "$.Payload.report_key"
              },
              "ResultPath": "$.validation",
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "Lambda.TooManyRequestsException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Next": "CheckValidationResult"
            },
            "CheckValidationResult": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.validation.validation_passed",
                  "BooleanEquals": true,
                  "Next": "StartBedrockIngestion"
                }
              ],
              "Default": "OutputValidationFailed"
            },
            "OutputValidationFailed": {
              "Type": "Fail",
              "Error": "OutputValidationFailed",
              "Cause": "Processed archive outputs failed centralized validation."
            },
            "StartBedrockIngestion": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:bedrockagent:startIngestionJob",
              "Parameters": {
                "KnowledgeBaseId": "${KnowledgeBaseId}",
                "DataSourceId": "${DataSourceId}",
                "Description.$": "States.Format('arXiv ingestion run {}', $.run_id)"
              },
              "ResultPath": "$.bedrock_start",
              "Retry": [
                {
                  "ErrorEquals": [
                    "BedrockAgent.ThrottlingException",
                    "BedrockAgent.InternalServerException"
                  ],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Next": "WaitForBedrockIngestion"
            },
            "WaitForBedrockIngestion": {
              "Type": "Wait",
              "Seconds": 30,
              "Next": "GetBedrockIngestionStatus"
            },
            "GetBedrockIngestionStatus": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:bedrockagent:getIngestionJob",
              "Parameters": {
                "KnowledgeBaseId": "${KnowledgeBaseId}",
                "DataSourceId": "${DataSourceId}",
                "IngestionJobId.$": "$.bedrock_start.IngestionJob.IngestionJobId"
              },
              "ResultPath": "$.bedrock_status",
              "Retry": [
                {
                  "ErrorEquals": [
                    "BedrockAgent.ThrottlingException",
                    "BedrockAgent.InternalServerException"
                  ],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Next": "CheckBedrockIngestionStatus"
            },
            "CheckBedrockIngestionStatus": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.bedrock_status.IngestionJob.Status",
                  "StringEquals": "COMPLETE",
                  "Next": "CheckBedrockDocumentFailures"
                },
                {
                  "Variable": "$.bedrock_status.IngestionJob.Status",
                  "StringEquals": "FAILED",
                  "Next": "BedrockIngestionFailed"
                },
                {
                  "Variable": "$.bedrock_status.IngestionJob.Status",
                  "StringEquals": "STOPPED",
                  "Next": "BedrockIngestionFailed"
                }
              ],
              "Default": "WaitForBedrockIngestion"
            },
            "BedrockIngestionFailed": {
              "Type": "Fail",
              "Error": "BedrockIngestionFailed",
              "Cause": "Amazon Bedrock Knowledge Base ingestion did not complete."
            },
            "CheckBedrockDocumentFailures": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.bedrock_status.IngestionJob.Statistics.NumberOfDocumentsFailed",
                  "NumericEquals": 0,
                  "Next": "BuildRunSummary"
                }
              ],
              "Default": "BedrockDocumentsFailed"
            },
            "BedrockDocumentsFailed": {
              "Type": "Fail",
              "Error": "BedrockDocumentsFailed",
              "Cause": "Amazon Bedrock completed ingestion, but one or more documents failed."
            },
            "BuildRunSummary": {
              "Type": "Pass",
              "Parameters": {
                "run_id.$": "$.run_id",
                "manifest_bucket.$": "$.manifest_generation.manifest_bucket",
                "manifest_key.$": "$.manifest_generation.manifest_key",
                "archive_count.$": "$.manifest_generation.archive_count",
                "expected_pdf_count.$": "$.manifest_generation.expected_pdf_count",
                "total_archive_bytes.$": "$.manifest_generation.total_archive_bytes",
                "max_concurrency.$": "$.max_concurrency",
                "knowledge_base_id.$": "$.bedrock_status.IngestionJob.KnowledgeBaseId",
                "data_source_id.$": "$.bedrock_status.IngestionJob.DataSourceId",
                "ingestion_job_id.$": "$.bedrock_status.IngestionJob.IngestionJobId",
                "ingestion_status.$": "$.bedrock_status.IngestionJob.Status",
                "started_at.$": "$.bedrock_status.IngestionJob.StartedAt",
                "updated_at.$": "$.bedrock_status.IngestionJob.UpdatedAt"
              },
              "ResultPath": "$.run_summary",
              "Next": "WriteRunSummary"
            },
            "WriteRunSummary": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${RunSummaryFunctionArn}",
                "Payload": {
                  "output_bucket.$": "$.output_bucket",
                  "run_id.$": "$.run_id",
                  "run_summary.$": "$.run_summary"
                }
              },
              "ResultSelector": {
                "bucket.$": "$.Payload.bucket",
                "key.$": "$.Payload.key",
                "status.$": "$.Payload.status"
              },
              "ResultPath": "$.summary_write",
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "Lambda.TooManyRequestsException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Next": "PipelineSucceeded"
            },
            "PipelineSucceeded": {
              "Type": "Succeed"
            }
          }
        }

      Tags:
        - Key: Project
          Value: arxiv-pipeline
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  ManifestParserFunctionArn:
    Description: ARN of the CloudFormation-managed manifest-parser Lambda.
    Value: !GetAtt ManifestParserFunction.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-manifest-parser-function-arn"

  RunSummaryFunctionArn:
    Description: ARN of the CloudFormation-managed run-summary Lambda.
    Value: !GetAtt RunSummaryFunction.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-run-summary-function-arn"

  StepFunctionsRoleArn:
    Description: ARN of the CloudFormation-managed Step Functions role.
    Value: !GetAtt StepFunctionsExecutionRole.Arn
    Export:
      Name: !Sub "${ProjectName}-${Environment}-step-functions-role-arn"

  StateMachineArn:
    Description: ARN of the CloudFormation-managed ingestion state machine.
    Value: !Ref IngestionStateMachine
    Export:
      Name: !Sub "${ProjectName}-${Environment}-state-machine-arn"
